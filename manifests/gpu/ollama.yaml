apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: ollama
  name: ollama
  namespace: default
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: ollama
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
      - env:
        - name: OLLAMA_HOST
          value: 0.0.0.0:11434
        - name: NVIDIA_VISIBLE_DEVICES
          value: all
        - name: NVIDIA_DRIVER_CAPABILITIES
          value: compute,utility
        - name: OLLAMA_MAX_LOADED_MODELS
          value: '1'
        - name: OLLAMA_NUM_PARALLEL
          value: '1'
        image: ollama/ollama:latest
        imagePullPolicy: IfNotPresent
        name: ollama
        ports:
        - containerPort: 11434
          protocol: TCP
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /root/.ollama
          name: ollama-data
      dnsConfig:
        nameservers:
        - 1.1.1.1
        - 8.8.8.8
      dnsPolicy: None
      nodeSelector:
        homelab.local/gpu: 'true'
      restartPolicy: Always
      runtimeClassName: nvidia
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - hostPath:
          path: ${DATA_ROOT}/ollama-data
          type: DirectoryOrCreate
        name: ollama-data
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: ollama
  name: ollama
  namespace: default
spec:
  externalTrafficPolicy: Cluster
  ports:
  - nodePort: 30434
    port: 11434
    protocol: TCP
    targetPort: 11434
  selector:
    app: ollama
  type: NodePort
