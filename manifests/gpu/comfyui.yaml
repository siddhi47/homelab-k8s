apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: comfyui
  name: comfyui
  namespace: default
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: comfyui
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: comfyui
    spec:
      containers:
      - env:
        - name: WANTED_UID
          value: '1025'
        - name: WANTED_GID
          value: '1025'
        - name: BASE_DIRECTORY
          value: /basedir
        - name: SECURITY_LEVEL
          value: normal
        - name: USE_UV
          value: 'true'
        - name: COMFY_CMDLINE_EXTRA
          value: --extra-model-paths-config /basedir/extra_model_paths.yaml
        - name: NVIDIA_VISIBLE_DEVICES
          value: all
        - name: NVIDIA_DRIVER_CAPABILITIES
          value: compute,utility
        image: mmartial/comfyui-nvidia-docker:latest
        imagePullPolicy: IfNotPresent
        name: comfyui
        ports:
        - containerPort: 8188
          protocol: TCP
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /comfy/mnt
          name: comfyui-data
          subPath: run
        - mountPath: /basedir
          name: comfyui-data
          subPath: basedir
        - mountPath: /a1111-models
          name: a1111-models
          readOnly: true
        - mountPath: /dev/shm
          name: dshm
      dnsConfig:
        nameservers:
        - 1.1.1.1
        - 8.8.8.8
      dnsPolicy: None
      nodeSelector:
        homelab.local/gpu: 'true'
      restartPolicy: Always
      runtimeClassName: nvidia
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - hostPath:
          path: ${DATA_ROOT}/comfyui-data
          type: DirectoryOrCreate
        name: comfyui-data
      - hostPath:
          path: ${DATA_ROOT}/sd-webui-data/models
          type: Directory
        name: a1111-models
      - emptyDir:
          medium: Memory
          sizeLimit: 2Gi
        name: dshm
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: comfyui
  name: comfyui
  namespace: default
spec:
  externalTrafficPolicy: Cluster
  ports:
  - nodePort: 30188
    port: 8188
    protocol: TCP
    targetPort: 8188
  selector:
    app: comfyui
  type: NodePort
