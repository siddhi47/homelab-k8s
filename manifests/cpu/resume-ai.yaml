apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: resume-ai
  name: resume-ai
  namespace: default
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: resume-ai
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: resume-ai
    spec:
      containers:
        # Overriding the image's CMD rather than rebuilding: the baked-in default is a
        # single worker on a short timeout, which cannot survive a local-LLM request.
        # --timeout 1800: a tailoring run is plan pass + full-document rewrite + up to
        # one validation retry. Against qwen3:32b (measured: 163 tok/s prompt,
        # 22 tok/s generation) that is ~490s, and ~560s if the model has to be loaded
        # first. The previous 480 cut requests off mid-generation.
        # --threads 4: a long generation holds one thread, so the health probes below
        # still get served while a resume is being written.
      - command: ["gunicorn"]
        args: ["-b", "0.0.0.0:5050", "--timeout", "1800", "--workers", "2", "--threads", "4", "app:app"]
        env:
        - name: FLASK_APP
          value: app.py
        - name: FLASK_ENV
          value: production
        - name: GITHUB_MCP_MODE
          value: hosted
        # Chat backend. LLM_PROVIDER=ollama routes every call site through
        # src/resume_bot/llm.py to the model below instead of the OpenAI API.
        # OLLAMA_BASE_URL is a LAN address, not a cluster Service: this model runs on a
        # Mac outside the cluster. Note that host sleeps if left idle - see README.
        - name: LLM_PROVIDER
          value: ollama
        - name: OLLAMA_MODEL
          value: qwen3:32b
        - name: OLLAMA_BASE_URL
          value: http://10.0.0.35:11434
        - name: OLLAMA_NUM_PREDICT
          value: '8192'
        envFrom:
        - secretRef:
            name: resume-ai-secrets
        image: resume-ai:local
        imagePullPolicy: Never
        # timeoutSeconds MUST stay well above a healthy response time. It was 1s, which
        # killed the pod mid-request and presented as a crash loop rather than a timeout.
        livenessProbe:
          failureThreshold: 6
          httpGet:
            path: /
            port: 5050
            scheme: HTTP
          initialDelaySeconds: 90
          periodSeconds: 30
          successThreshold: 1
          timeoutSeconds: 10
        name: resume-ai
        ports:
        - containerPort: 5050
          protocol: TCP
        readinessProbe:
          failureThreshold: 6
          httpGet:
            path: /
            port: 5050
            scheme: HTTP
          initialDelaySeconds: 15
          periodSeconds: 15
          successThreshold: 1
          timeoutSeconds: 10
        resources:
          limits:
            memory: 2Gi
          requests:
            cpu: 100m
            memory: 256Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /app/data
          name: resume-ai-data
          subPath: data
        - mountPath: /app/static/resumes
          name: resume-ai-data
          subPath: resumes
      dnsPolicy: ClusterFirst
      nodeSelector:
        homelab.local/cpu: 'true'
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - hostPath:
          path: ${DATA_ROOT}/resume-ai-data
          type: DirectoryOrCreate
        name: resume-ai-data
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: resume-ai
  name: resume-ai
  namespace: default
spec:
  externalTrafficPolicy: Cluster
  ports:
  - nodePort: 30505
    port: 5050
    protocol: TCP
    targetPort: 5050
  selector:
    app: resume-ai
  type: NodePort
