apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: my-infer
  name: my-infer
  namespace: default
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: my-infer
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: my-infer
    spec:
      containers:
      - envFrom:
        - configMapRef:
            name: my-config
        - secretRef:
            name: my-secrets
        image: my-infer:local
        imagePullPolicy: IfNotPresent
        name: my-infer
        ports:
        - containerPort: 5050
          protocol: TCP
        resources:
          limits:
            cpu: '2'
            memory: 4Gi
          requests:
            cpu: '1'
            memory: 1Gi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      nodeSelector:
        homelab.local/cpu: 'true'
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: my-infer
  name: my-infer
  namespace: default
spec:
  externalTrafficPolicy: Cluster
  ports:
  - nodePort: 32050
    port: 5050
    protocol: TCP
    targetPort: 5050
  selector:
    app: my-infer
  type: NodePort
